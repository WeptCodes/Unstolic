	<style>
		:root {
			--blue: #073b73;
			--blue-deep: #052d59;
			--blue-soft: #eaf2fa;
			--yellow: #ffd21f;
			--ink: #17212b;
			--muted: #526171;
			--line: #d7e0e8;
			--blue-soft: #edf3f8;
			--focus-color: #073b73;
		}
		* { box-sizing: border-box; }
		body {
			display: grid;
			min-height: 100vh;
			min-height: 100svh;
			margin: 0;
			padding: clamp(24px, 6vw, 72px);
			place-items: center;
			overflow-x: hidden;
			color: var(--ink);
			background: var(--blue);
			font-family: Arial, Helvetica, sans-serif;
			line-height: 1.6;
		}
		h1, h2, h3, h4 { font-family: "Avenir Next", "Trebuchet MS", Arial, sans-serif; }
		a { color: inherit; text-decoration: none; }
		:where(a, button, input, textarea, select, summary, [tabindex]:not([tabindex="-1"])):focus-visible { outline: 3px solid var(--focus-color); outline-offset: 3px; }
		.skip-link { position: fixed; top: 12px; left: 12px; z-index: 1000; transform: translateY(calc(-100% - 16px)); padding: 10px 16px; border-radius: 4px; background: var(--blue-deep); color: #fff; font-weight: 700; }
		.skip-link:focus { transform: translateY(0); outline-color: var(--yellow); }
		main[tabindex="-1"] { scroll-margin-top: 96px; }
		.error-card {
			position: relative;
			width: min(100%, 720px);
			padding: clamp(28px, 7vw, 64px);
			overflow: hidden;
			border: 1px solid rgba(255,255,255,.2);
			border-radius: 22px;
			background: #fff;
			box-shadow: 0 12px 32px rgba(0,0,0,.14);
		}
		.brand {
			position: relative;
			z-index: 1;
			display: inline-flex;
			align-items: center;
			gap: 12px;
			color: var(--blue);
			font-size: .9rem;
			font-weight: 800;
			line-height: 1.2;
		}
		.brand img { display: block; width: 64px; height: 54px; border-radius: 8px; object-fit: contain; }
		.brand-title { display: inline-block; color: var(--blue); font-size: 1.4rem; letter-spacing: .015em; -webkit-text-stroke: 1px #e6007e; paint-order: stroke fill; text-decoration: underline; text-decoration-color: #16834b; text-decoration-thickness: 2.5px; text-underline-offset: 5px; }
		.brand small {
			display: block;
			margin-top: 4px;
			color: var(--muted);
			font-size: .68rem;
			letter-spacing: .12em;
		}
		.error-code {
			margin: clamp(28px, 6vw, 48px) 0 0;
			color: var(--blue);
			font-size: clamp(5rem, 24vw, 10rem);
			font-weight: 900;
			letter-spacing: -.09em;
			line-height: .9;
		}
		.eyebrow {
			margin: 22px 0 6px;
			color: var(--blue);
			font-size: .8rem;
			font-weight: 800;
			letter-spacing: .14em;
			text-transform: uppercase;
		}
		h1 {
			position: relative;
			z-index: 1;
			margin: 0;
			color: var(--blue-deep);
			font-size: clamp(1.8rem, 6vw, 2.8rem);
			letter-spacing: -.04em;
			line-height: 1.12;
		}
		.message {
			position: relative;
			z-index: 1;
			max-width: 520px;
			margin: 14px 0 26px;
			color: var(--muted);
		}
		.actions {
			position: relative;
			z-index: 1;
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
		}
		.button {
			display: inline-flex;
			min-height: 48px;
			align-items: center;
			justify-content: center;
			padding: 0 20px;
			border: 1px solid var(--blue);
			border-radius: 7px;
			background: var(--blue);
			color: #fff;
			font-weight: 800;
			transition: background-color .18s;
		}
		.button:hover { background: var(--blue-deep); }
		.button.secondary { background: #fff; color: var(--blue); }
		.button.secondary:hover { background: var(--blue-soft); }
		.text-settings {
			position: fixed;
			top: max(12px, env(safe-area-inset-top));
			left: max(12px, env(safe-area-inset-left));
			z-index: 2;
			color: var(--blue-deep);
			font: 14px/1.4 Arial, Helvetica, sans-serif;
		}
		.text-settings summary {
			cursor: pointer;
			list-style: none;
			padding: 9px 12px;
			border: 1px solid rgba(7,59,115,.16);
			border-radius: 9px;
			background: #fff;
			box-shadow: 0 4px 14px rgba(5,45,89,.14);
			font-weight: 800;
		}
		.text-settings summary::-webkit-details-marker { display: none; }
		.text-settings summary:hover, .text-settings summary:focus-visible { background: var(--blue-soft); }
		.text-settings-panel {
			position: absolute;
			top: calc(100% + 8px);
			left: 0;
			width: 220px;
			padding: 14px;
			border: 1px solid var(--line);
			border-radius: 12px;
			background: #fff;
			box-shadow: 0 12px 30px rgba(5,45,89,.18);
		}
		.text-settings-panel p { margin: 0 0 10px; font-weight: 800; }
		.text-size-controls { display: flex; align-items: center; gap: 8px; }
		.text-settings button {
			min-height: 38px;
			padding: 0 11px;
			border: 1px solid var(--line);
			border-radius: 7px;
			background: #fff;
			color: var(--blue-deep);
			cursor: pointer;
			font: inherit;
			font-weight: 800;
		}
		.text-settings button:hover:not(:disabled) { background: var(--blue-soft); }
		.text-settings button:disabled { cursor: not-allowed; opacity: .45; }
		.text-size-controls output { min-width: 48px; text-align: center; font-weight: 700; }
		.text-settings .text-size-reset { width: 100%; margin-top: 10px; }
		.theme-setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; cursor: pointer; font-weight: 700; }
		.theme-setting input { position: absolute; width: 1px; height: 1px; opacity: 0; }
		.theme-setting-track { position: relative; flex: 0 0 42px; height: 24px; border-radius: 999px; background: #c7d2de; transition: background .18s; }
		.theme-setting-track:before { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .18s; }
		.theme-setting input:checked + .theme-setting-track { background: var(--blue); }
		.theme-setting input:checked + .theme-setting-track:before { transform: translateX(18px); }
		.theme-setting input:focus-visible + .theme-setting-track { outline: 3px solid var(--focus-color); outline-offset: 2px; }
		:root[data-theme="dark"] {
			color-scheme: dark;
			--ink: #e7edf5;
			--muted: #a9b7c6;
			--line: #2e3d4d;
			--blue-soft: #1d3043;
			--focus-color: #ffd21f;
		}
		:root[data-theme="dark"] .error-card,
		:root[data-theme="dark"] .text-settings summary,
		:root[data-theme="dark"] .text-settings-panel,
		:root[data-theme="dark"] .text-settings button { background-color: #182431; }
		:root[data-theme="dark"] .error-card { border-color: var(--line); }
		:root[data-theme="dark"] .text-settings,
		:root[data-theme="dark"] .text-settings button { color: var(--ink); }
		:root[data-theme="dark"] .brand,
		:root[data-theme="dark"] .error-code { color: #9bc8ff; }
		:root[data-theme="dark"] .brand-title { color: #9bc8ff; }
		:root[data-theme="dark"] h1 { color: var(--ink); }
		:root[data-theme="dark"] .eyebrow { color: var(--yellow); }
		:root[data-theme="dark"] .button.secondary { background: #1d3043; color: #9bc8ff; }
		@media (max-width: 520px) {
			body { padding: 64px 16px 24px; }
			.error-card { padding: 28px 22px; }
			.actions { flex-direction: column; }
			.button { width: 100%; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
		}
	</style>

	<script>
		(function() {
			const scales = [0.875, 1, 1.125, 1.25];
			const settings = document.querySelector('.text-settings');
			const output = settings.querySelector('output');
			const decrease = settings.querySelector('[data-text-size="decrease"]');
			const increase = settings.querySelector('[data-text-size="increase"]');
			const key = 'unstolic_text_scale';
			let scale = Number(localStorage.getItem(key));
			if (!scales.includes(scale)) scale = 1;
			function applyScale(nextScale) {
				scale = nextScale;
				document.documentElement.style.fontSize = (scale * 100) + '%';
				localStorage.setItem(key, String(scale));
				output.textContent = Math.round(scale * 100) + '%';
				decrease.disabled = scale === scales[0];
				increase.disabled = scale === scales[scales.length - 1];
			}
			settings.addEventListener('click', function(event) {
				const button = event.target.closest('[data-text-size]');
				if (!button) return;
				const action = button.getAttribute('data-text-size');
				if (action === 'reset') {
					applyScale(1);
				} else {
					const index = scales.indexOf(scale);
					applyScale(scales[index + (action === 'increase' ? 1 : -1)]);
				}
			});
			applyScale(scale);
		})();
	</script>
	<script>
		(function() {
			const toggle = document.querySelector('[data-theme-toggle]');
			if (!toggle) return;
			const key = 'unstolic_theme';
			toggle.checked = document.documentElement.dataset.theme === 'dark';
			toggle.addEventListener('change', function() {
				const theme = toggle.checked ? 'dark' : 'light';
				document.documentElement.dataset.theme = theme;
				localStorage.setItem(key, theme);
			});
		})();
	</script>

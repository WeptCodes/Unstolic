<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620">
  <defs>
    <!-- Main Blue Sphere Radial Gradient -->
    <radialGradient id="sphereGrad" cx="38%" cy="28%" r="68%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Glossy Top Highlight Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Logo -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Large Top-Left Blue Orb -->
    <g transform="translate(222, 165)">
      <circle cx="0" cy="0" r="115" fill="url(#sphereGrad)" />
      <!-- Curved glossy reflection -->
      <path d="M -98,-25 A 102,102 0 0,1 98,-25 C 65,15 -65,15 -98,-25 Z" fill="url(#glossGrad)" />
      <!-- Specular highlight dot -->
      <ellipse cx="42" cy="-58" rx="22" ry="16" transform="rotate(28 42 -58)" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Medium Top-Right Blue Orb -->
    <g transform="translate(458, 178)">
      <circle cx="0" cy="0" r="65" fill="url(#sphereGrad)" />
      <path d="M -55,-14 A 58,58 0 0,1 55,-14 C 36,8 -36,8 -55,-14 Z" fill="url(#glossGrad)" />
      <ellipse cx="24" cy="-32" rx="12" ry="9" transform="rotate(28 24 -32)" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Bold Navy "URL" Typography -->
    <g fill="#16468c">
      <!-- Letter U -->
      <path d="M 85,270 H 148 V 430 C 148,452 162,464 185,464 C 208,464 222,452 222,430 V 270 H 285 V 432 C 285,492 245,526 185,526 C 125,526 85,492 85,432 Z" />

      <!-- Stylized Letter R -->
      <path d="M 308,270 H 432 C 482,270 512,298 512,344 C 512,380 492,405 458,414 C 488,423 506,448 510,485 L 514,522 H 450 L 446,488 C 442,456 426,442 394,442 H 308 V 386 H 416 C 438,386 450,374 450,354 C 450,334 438,324 416,324 H 308 Z" />

      <!-- Letter L -->
      <path d="M 535,270 H 598 V 464 H 705 V 522 H 535 Z" />
    </g>

    <!-- Small Right Blue Orb (next to L) -->
    <g transform="translate(652, 342)">
      <circle cx="0" cy="0" r="44" fill="url(#sphereGrad)" />
      <path d="M -37,-10 A 39,39 0 0,1 37,-10 C 24,6 -24,6 -37,-10 Z" fill="url(#glossGrad)" />
      <ellipse cx="16" cy="-22" rx="8" ry="6" transform="rotate(28 16 -22)" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Bottom-Left Small Orb Dot -->
    <g transform="translate(306, 514)">
      <circle cx="0" cy="0" r="15" fill="url(#sphereGrad)" />
      <circle cx="-4" cy="-5" r="4" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Bottom-Right Small Orb Dot -->
    <g transform="translate(514, 514)">
      <circle cx="0" cy="0" r="15" fill="url(#sphereGrad)" />
      <circle cx="-4" cy="-5" r="4" fill="#ffffff" opacity="0.85" />
    </g>
  </g>
</svg>